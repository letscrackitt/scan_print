name = "scan-print"
main = "src/index.js"
compatibility_date = "2026-11-06"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "scan-print-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "scan-print-files"

[vars]
SHOP_SLUG = "pilot-shop"
SHOP_NAME = "Printing Shop"
MAX_ORDER_BYTES = "524288000"
FILE_RETENTION_HOURS = "24"
