<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop print orders</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6fa;color:#172033;margin:0;padding:20px}.wrap{max-width:900px;margin:20px auto}.panel,.order{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #15233b0b}h1{margin:0 0 8px}.muted{color:#667085}input{padding:13px;border:1px solid #ccd3df;border-radius:9px;width:100%;margin:10px 0}button{padding:12px 16px;border:0;border-radius:9px;background:#155eef;color:white;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#e9eef7;color:#172033}.hidden{display:none}.files{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.file{border:1px solid #e1e6ef;padding:10px;border-radius:10px;min-width:150px;max-width:220px}.file img{width:100%;height:120px;object-fit:contain;background:#f6f7f9}.file a{display:block;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.new{color:#087443;font-weight:bold}
</style></head><body><main class="wrap">
<section id="login" class="panel"><h1>Shop print orders</h1><p class="muted">Enter the shop password to see new files.</p><input id="password" type="password" placeholder="Shop password"><button id="loginBtn">Open orders</button><p id="loginError" class="muted"></p></section>
<section id="app" class="hidden"><div class="row"><div><h1>New customer files</h1><p class="muted">Open an order, view the files and download or copy what you need.</p></div><button class="secondary" id="refresh">Refresh</button></div><div id="orders"></div></section>
</main><script>
const $=s=>document.querySelector(s);let timer;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Something went wrong");return d}
$("#loginBtn").onclick=async()=>{try{await api("/api/login",{method:"POST",body:JSON.stringify({password:$("#password").value})});$("#login").classList.add("hidden");$("#app").classList.remove("hidden");load();timer=setInterval(load,7000)}catch(e){$("#loginError").textContent=e.message}};
async function load(){try{const d=await api("/api/admin/orders");$("#orders").innerHTML="";if(!d.orders.length){$("#orders").innerHTML='<div class="panel muted">No files yet. New customer uploads will appear here.</div>';return}for(const o of d.orders){const el=document.createElement("section");el.className="order";const title=document.createElement("div");title.className="row";title.innerHTML='<strong>Order #'+o.id.slice(0,8).toUpperCase()+'</strong><span class="new">'+(o.status==="completed"?"Completed":"New files")+'</span>';el.append(title);const info=document.createElement("p");info.className="muted";info.textContent=o.file_count+" files · "+(o.total_bytes/1048576).toFixed(1)+" MB";el.append(info);const actions=document.createElement("div");const view=document.createElement("button");view.textContent="View files";view.onclick=()=>showFiles(o.id,el);actions.append(view);const done=document.createElement("button");done.className="secondary";done.textContent="Mark completed";done.onclick=async()=>{await api("/api/admin/orders/"+o.id+"/complete",{method:"POST"});load()};actions.append(done);el.append(actions);$("#orders").append(el)}}catch(e){$("#orders").innerHTML='<div class="panel">'+e.message+'</div>'}}
async function showFiles(id,container){const d=await api("/api/admin/orders/"+id+"/files");let box=container.querySelector(".files");if(box){box.remove();return}box=document.createElement("div");box.className="files";for(const f of d.files){const card=document.createElement("div");card.className="file";const url="/api/admin/files/"+f.id;if(f.content_type.startsWith("image/")){const img=document.createElement("img");img.src=url;card.append(img)}const name=document.createElement("a");name.href=url;name.target="_blank";name.textContent=f.original_name;card.append(name);const copy=document.createElement("button");copy.className="secondary";copy.textContent="Copy image";copy.onclick=async()=>{try{const blob=await(await fetch(url)).blob();await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);copy.textContent="Copied"}catch{alert("Copy isn't available here. Open or download the image instead.")}};if(!f.content_type.startsWith("image/"))copy.style.display="none";card.append(copy);const download=document.createElement("a");download.href=url;download.download=f.original_name;download.textContent="Download";card.append(download);box.append(card)}container.append(box)}
$("#refresh").onclick=load;
</script></body></html>
